---
name: Deploy Production

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 5 * * *'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
      pages: write
    name: Deploy to GitHub Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install d2
        env:
          # Pinned: the upstream install.sh runs `make install`, which writes a
          # man page into /usr/local/share/man/man1 and fails on GitHub runners
          # with "Permission denied". Installing the binary directly avoids that,
          # and pins the version instead of piping an unversioned script to sh.
          D2_VERSION: 0.7.1
          D2_SHA256: eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
        run: |
          curl -fsSL -o d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  d2.tar.gz" | sha256sum -c -
          tar -xzf d2.tar.gz
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "d2-v${D2_VERSION}/bin/d2" "${HOME}/.local/bin/d2"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          rm -rf d2.tar.gz "d2-v${D2_VERSION}"
          "${HOME}/.local/bin/d2" --version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build D2 diagrams
        run: bun run build:d2

      - name: Build CSS
        run: bun run build:css

      - name: Build Hugo site
        run: hugo --minify --environment production

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sbom-javascript:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Upload SBOM
        uses: sbomify/sbomify-action@master
        env:
          COMPONENT_ID: 'XalR981KPFba'
          COMPONENT_NAME: 'Marketing Site (JavaScript)'
          COMPONENT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-{1}', github.ref_name, github.sha) }}
          LOCK_FILE: 'package-lock.json'
          AUGMENT: true
          ENRICH: true
          OUTPUT_FILE: sbom.cdx.json

  sbom-hugo:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        id: hugo-version
        run: |
          HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          echo "version=v${HUGO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM
        uses: sbomify/sbomify-action@master
        env:
          COMPONENT_ID: 'jtYGL1IMu1gQ'
          COMPONENT_NAME: 'Marketing Site (Hugo)'
          COMPONENT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-{1}', github.ref_name, github.sha) }}
          LOCK_FILE: none
          ADDITIONAL_PACKAGES: 'pkg:golang/github.com/gohugoio/hugo@${{ steps.hugo-version.outputs.version }}'
          AUGMENT: true
          ENRICH: true
          OUTPUT_FILE: sbom.cdx.json
