---
name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '**/*.md'
      - '_d2/*.d2'
      - '.github/workflows/lint.yml'
      - '.dprint.json'
      - 'package.json'
      - 'Dockerfile'
      - 'hugo.toml'
      - 'layouts/**'
      - 'content/**'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  lint:
    name: Lint All Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Install d2
        env:
          # Pinned: the upstream install.sh runs `make install`, which writes a
          # man page into /usr/local/share/man/man1 and fails on GitHub runners
          # with "Permission denied". Installing the binary directly avoids that,
          # and pins the version instead of piping an unversioned script to sh.
          D2_VERSION: 0.7.1
          D2_SHA256: eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
        run: |
          curl -fsSL -o d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  d2.tar.gz" | sha256sum -c -
          tar -xzf d2.tar.gz
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "d2-v${D2_VERSION}/bin/d2" "${HOME}/.local/bin/d2"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          rm -rf d2.tar.gz "d2-v${D2_VERSION}"
          "${HOME}/.local/bin/d2" --version

      - name: Run linters
        run: bun run lint

  hugo-build:
    name: Hugo Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install d2
        env:
          # Pinned: the upstream install.sh runs `make install`, which writes a
          # man page into /usr/local/share/man/man1 and fails on GitHub runners
          # with "Permission denied". Installing the binary directly avoids that,
          # and pins the version instead of piping an unversioned script to sh.
          D2_VERSION: 0.7.1
          D2_SHA256: eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
        run: |
          curl -fsSL -o d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  d2.tar.gz" | sha256sum -c -
          tar -xzf d2.tar.gz
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "d2-v${D2_VERSION}/bin/d2" "${HOME}/.local/bin/d2"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          rm -rf d2.tar.gz "d2-v${D2_VERSION}"
          "${HOME}/.local/bin/d2" --version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build D2 diagrams
        run: bun run build:d2

      - name: Build CSS
        run: bun run build:css

      - name: Build Hugo site
        run: hugo --minify

      - name: Check internal links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # llms.txt and llms-full.txt are excluded: they contain raw Markdown
          # (including placeholder URLs inside code examples) that lychee scans
          # as plaintext; every real link in them also exists in the HTML pages.
          args: --no-progress --offline --root-dir ${{ github.workspace }}/public --exclude-path '${{ github.workspace }}/public/llms.txt' --exclude-path '${{ github.workspace }}/public/llms-full.txt' ${{ github.workspace }}/public
          fail: true
