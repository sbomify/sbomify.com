baseURL = "https://sbomify.com"
title = "Sbomify"
languageCode = "en-us"

# Enable .GitInfo (replaces _plugins/git_dates.rb)
#
# Keep this and ignoreFiles ABOVE the first table header. TOML assigns every
# bare key to the table that precedes it, so while these sat under
# [pagination] they were parsed as pagination.enableGitInfo /
# pagination.ignoreFiles -- silently dropped by Hugo, with no root-level
# enableGitInfo in `hugo config` at all. The visible symptom was .GitInfo nil
# and .Lastmod zero on every page, which put "0001-01-01T00:00:00Z" into the
# dateModified of 28 FAQ pages.
enableGitInfo = true

# Ignore leftover Jekyll files
ignoreFiles = ["_config\\.yml$", "_config_development\\.yml$", "Gemfile", "Gemfile\\.lock", "convert_to_webp\\.rb$"]

# Pagination (matches jekyll-paginate-v2: 12 per page)
[pagination]
  pagerSize = 12
  path = "page"

# Match Jekyll permalink exactly: /:year/:month/:day/:slug/
[permalinks]
  [permalinks.page]
    posts = "/:year/:month/:day/:slug/"
  [permalinks.section]
    posts = "/blog/"

[taxonomies]
  tag = "tags"
  category = "categories"

# Markdown: goldmark with raw HTML enabled (matches kramdown behavior)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    noClasses = false

# RSS feed at /feed.xml (not default /index.xml)
[outputFormats.RSS]
  baseName = "feed"
  mediaType = "application/rss+xml"

# llms.txt (index) and llms-full.txt (full content) per https://llmstxt.org
# Rendered from layouts/home.llms.txt and layouts/home.llmsfull.txt
[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true

[outputFormats.llmsfull]
  baseName = "llms-full"
  mediaType = "text/plain"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "llms", "llmsfull"]
  section = ["HTML"]

# Sitemap (replaces jekyll-sitemap)
[sitemap]
  changefreq = ""
  filename = "sitemap.xml"

# Minification (replaces jekyll-minifier)
[minify]
  minifyOutput = true
  [minify.tdewolff.html]
    # Cloudflare's email obfuscation is switched off per-region with
    # <!--email_off--> markers (see layouts/_default/_markup/render-codeblock.html),
    # and the minifier drops every comment unless told otherwise. Template
    # comments use {{/* */}} so this only preserves the markers themselves.
    keepComments = true

# Custom params
[params]
  description = "Your Security Artifact Hub. From zero to SBOM hero. Generate, manage, and share SBOMs and compliance documents. Built for CRA compliance and seamless integration with your existing tools."
  keywords = ["SBOM", "Supply Chain Security", "CRA Compliance", "NTIA Compliant", "Software Bill of Materials", "SBOM Management", "Security Artifact Hub"]
  posthog_api_key = "phc_kWvZ17AgVDC3CAEHYG2oQBYEg5lUnyK3brPqJ6P4nPH"

  [params.social]
    image = "/assets/images/site/sbomify.png"
    [[params.social.profiles]]
      platform = "X"
      url = "https://x.com/sbomify"
      handle = "sbomify"
    [[params.social.profiles]]
      platform = "LinkedIn"
      url = "https://www.linkedin.com/company/sbomify/"

# Module mounts: serve assets/images and assets/fonts as static files
# so /assets/images/... URLs work in content, while assets/ also works
# for Hugo Pipes (resources.Get) in templates
[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "assets/images"
  target = "static/assets/images"

[[module.mounts]]
  source = "assets/fonts"
  target = "static/assets/fonts"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "data"
  target = "data"

# Exclude files from Hugo processing
[build]
  [build.buildStats]
    enable = false

# Recent Hugo releases tightened the default `security.allowContent` policy to
# deny `text/html` content files. This site intentionally authors several pages
# as raw .html (homepage, pricing, about, integrations, trust-center), so we
# restore the previous permissive behaviour here.
[security]
  allowContent = ['.*']
