{{ define "main" }}
<div>
  <div class="hero px-5 py-16 lg:py-24 lg:px-24">

    {{/* Content */}}
    <div class="relative max-w-4xl mx-auto text-center">
      <h1 class="text-ink text-[40px] lg:text-[68px] leading-[48px] lg:leading-[78px] mb-6">
        {{ .Title }}
      </h1>
      {{ with .Params.plan }}
      <span class="inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-surface-strong text-ink border border-line">{{ . }} plan</span>
      {{ end }}
    </div>
  </div>

  <div class="bg-surface">
    <div class="max-w-4xl mx-auto px-6 lg:px-8 py-16 lg:py-24">
      {{/* Breadcrumb */}}
      <nav class="mb-8 text-sm text-ink-muted" aria-label="Breadcrumb">
        <ol class="flex items-center gap-2">
          <li><a href="/" class="hover:text-accent-strong transition-colors">Home</a></li>
          <li class="text-navy-40">/</li>
          <li><a href="/faq/" class="hover:text-accent-strong transition-colors">FAQ</a></li>
          <li class="text-navy-40">/</li>
          <li class="text-navy-80">{{ .Title }}</li>
        </ol>
      </nav>

      <article class="faq-content bg-canvas p-8 md:p-12 rounded-2xl shadow-card border border-line">
        {{ partial "tldr.html" . }}
        {{ partial "content.html" . }}
      </article>

      {{/* Bottom navigation */}}
      <div class="mt-12 flex flex-wrap items-center justify-between gap-4">
        <a href="/faq/" class="text-ink hover:text-accent-strong font-semibold transition-colors no-underline">
          &larr; All FAQ
        </a>
        <a href="https://app.sbomify.com" class="btn-primary no-underline">
          Try sbomify Free
        </a>
      </div>
    </div>
  </div>
</div>
{{ end }}
