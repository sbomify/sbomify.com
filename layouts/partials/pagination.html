{{ $paginator := .Paginator }}

<nav class="flex flex-wrap items-center gap-3 border-t border-line pt-8" aria-label="Pagination">
  {{ if $paginator.HasPrev }}
    <a href="{{ $paginator.Prev.URL }}" class="btn-secondary">&larr; Previous</a>
  {{ else }}
    <span class="btn-secondary opacity-45 cursor-not-allowed" aria-disabled="true">&larr; Previous</span>
  {{ end }}

  <span class="px-3 text-ink-subtle text-sm font-medium tabular-nums">Page {{ $paginator.PageNumber }} of {{ $paginator.TotalPages }}</span>

  {{ if $paginator.HasNext }}
    <a href="{{ $paginator.Next.URL }}" class="btn-navy">Next &rarr;</a>
  {{ else }}
    <span class="btn-secondary opacity-45 cursor-not-allowed" aria-disabled="true">Next &rarr;</span>
  {{ end }}
</nav>
