{{ $paginator := .Paginator }}

<nav class="flex justify-center items-center gap-4" aria-label="Pagination">
  {{ if $paginator.HasPrev }}
    <a href="{{ $paginator.Prev.URL }}" class="px-8 py-3 bg-canvas border border-line hover:border-ink text-ink hover:text-accent-strong rounded-full font-medium transition-all duration-200">&larr; Previous</a>
  {{ else }}
    <span class="px-8 py-3 bg-surface border border-line text-ink-muted rounded-full font-medium cursor-not-allowed">&larr; Previous</span>
  {{ end }}

  <span class="px-6 py-3 text-navy-80 font-medium">Page {{ $paginator.PageNumber }} of {{ $paginator.TotalPages }}</span>

  {{ if $paginator.HasNext }}
    <a href="{{ $paginator.Next.URL }}" class="btn-primary px-8">Next &rarr;</a>
  {{ else }}
    <span class="px-8 py-3 bg-surface border border-line text-ink-muted rounded-full font-medium cursor-not-allowed">Next &rarr;</span>
  {{ end }}
</nav>
