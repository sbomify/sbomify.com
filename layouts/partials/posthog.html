{{- with site.Params.posthog_api_key -}}
<script>
  /* PostHog is analytics, not a strictly necessary cookie, so under UK GDPR and
     the ePrivacy rules it may not run until the visitor has opted in. Nothing
     here loads the SDK or touches storage on its own: this file only exposes
     window.sbomifyAnalytics, and layouts/partials/cookie-consent.html decides
     when to call it. Declining therefore costs the visitor nothing -- the
     PostHog bundle is never even requested. */
  window.sbomifyAnalytics = (function () {
    var loaded = false;

    /* Page scripts (the pricing toggle, the CTA tracker below) call
       posthog.capture directly. Without a stand-in they would throw a
       ReferenceError for every visitor who declines. The loader snippet below
       overwrites these stubs with its own queueing versions. */
    if (!window.posthog) {
      window.posthog = { capture: function () {}, identify: function () {}, register: function () {} };
    }

    function load() {
      if (loaded) { return; }
      loaded = true;
      !function(t,e){var o,n,p,r;e.__SV||(window.posthog && window.posthog.__loaded)||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init zr Wr fi Br Gr ci Nr Hr capture Ui calculateEventProperties Kr register register_once register_for_session unregister unregister_for_session Zr getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSurveysLoaded onSessionId getSurveys getActiveMatchingSurveys renderSurvey displaySurvey cancelPendingSurvey canRenderSurvey canRenderSurveyAsync identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty Xr Jr createPersonProfile Qr jr ts opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing get_explicit_consent_status is_capturing clear_opt_in_out_capturing Vr debug O Yr getPageViewId captureTraceFeedback captureTraceMetric Or".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog);
      posthog.init('{{ site.Params.posthog_api_key }}', {
          api_host: 'https://us.i.posthog.com',
          defaults: '2025-11-30',
          person_profiles: 'identified_only',
      });
    }

    /* Loading is deferred to keep PostHog off the critical path. Used for the
       returning visitor whose consent is already on record; a visitor who has
       just clicked "Accept" gets load() straight away, since by then the page
       has long finished loading and waiting would drop their pageview. */
    function loadDeferred() {
      window.addEventListener('load', function () {
        setTimeout(load, 2000);
      });
    }

    /* Withdrawing consent has to remove what was already stored, not merely
       stop new events. opt_out_capturing() silences the SDK if it is running in
       this page, and the sweep clears the ph_* / __ph* entries -- including the
       cookie PostHog writes on .sbomify.com, since cross_subdomain_cookie
       defaults to true. Only ever called from an explicit "Reject" click, never
       on plain page loads, so a visitor's analytics state elsewhere on the
       domain is not repeatedly reset behind their back. */
    function forget() {
      if (loaded && window.posthog && window.posthog.__loaded) {
        try { window.posthog.opt_out_capturing(); } catch (e) {}
      }

      var host = window.location.hostname;
      var parts = host.split('.');
      var domains = ['', host, '.' + (parts.length > 2 ? parts.slice(-2).join('.') : host)];
      document.cookie.split(';').forEach(function (entry) {
        var name = entry.split('=')[0].trim();
        if (name.indexOf('ph_') !== 0 && name.indexOf('__ph') !== 0) { return; }
        domains.forEach(function (domain) {
          document.cookie = name + '=; Max-Age=0; path=/' + (domain ? '; domain=' + domain : '');
        });
      });

      try {
        Object.keys(window.localStorage).forEach(function (key) {
          if (key.indexOf('ph_') === 0 || key.indexOf('__ph') === 0) {
            window.localStorage.removeItem(key);
          }
        });
      } catch (e) {}
    }

    return { load: load, loadDeferred: loadDeferred, forget: forget };
  }());
  /* One delegated listener records every click towards a conversion as
     `cta_click`, so a sign-up or demo link added to a template or a Markdown
     page is counted without anyone remembering an onclick. `intent` is what
     funnels filter on: sign-up and sign-in share a URL, so sign-in links carry
     data-cta-intent="signin". data-cta-location / data-cta-label name the
     placement; links without them (prose links in posts, FAQs and guides)
     fall back to the page region they sit in and their own text. Pages with a
     tracked link that is not an app link (Slack on /pricing/) opt in through
     data-cta-location. */
  (function () {
    var section = '{{ with $.Section }}{{ . }}{{ else }}{{ if $.IsHome }}home{{ else }}page{{ end }}{{ end }}';

    function intentFor(a) {
      if (a.dataset.ctaIntent) { return a.dataset.ctaIntent; }
      if (a.hostname !== 'app.sbomify.com') { return a.dataset.ctaLocation ? 'other' : null; }
      if (a.pathname.indexOf('/enterprise-contact') === 0) { return 'demo'; }
      if (a.pathname === '/' || a.pathname === '') { return 'signup'; }
      return a.dataset.ctaLocation ? 'other' : null;
    }

    function regionOf(a) {
      if (a.closest('#mobile-menu')) { return 'mobile_menu'; }
      if (a.closest('footer')) { return 'footer'; }
      if (a.closest('header')) { return 'header'; }
      return 'in_content';
    }

    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) { return; }
      var intent = intentFor(a);
      if (!intent || !window.posthog.__loaded) { return; }
      window.posthog.capture('cta_click', {
        intent: intent,
        location: a.dataset.ctaLocation || regionOf(a),
        label: a.dataset.ctaLabel || a.textContent.trim().replace(/\s+/g, ' ').slice(0, 80),
        destination: a.href,
        site_section: section
      }, { send_instantly: true, transport: 'sendBeacon' });
    }, true);
  }());
</script>
{{- end -}}
