<header class="sticky top-0 z-50 bg-canvas">
  <div class="max-w-7xl mx-auto px-6 py-4">
    <div class="flex justify-between items-center bg-canvas rounded-full px-6 py-3 border border-line shadow-card">
      <div class="flex gap-10 items-center">
        <a href="/" class="hover:opacity-80 transition-opacity">
          {{/* Navy on white: the default colourway */}}
          {{ $logo := resources.Get "images/site/logo-navy.svg" }}
          {{ if $logo }}
          {{ $logo = $logo | fingerprint }}
          <img src="{{ $logo.RelPermalink }}" alt="sbomify logo" class="h-7" width="128" height="24" />
          {{ else }}
          <img src="/assets/images/site/logo-navy.svg" alt="sbomify logo" class="h-7" width="128" height="24" />
          {{ end }}
        </a>
      </div>
      <div class="flex gap-2 items-center">
        <div class="flex items-center gap-1">
          {{ partial "nav.html" . }}
        </div>
        <div class="hidden lg:flex items-center gap-2 ml-2">
          <a href="{{ site.Params.signinURL }}" class="px-3 py-2 text-sm font-medium text-ink-muted hover:text-ink transition-colors" onclick="posthog.capture('cta_click', { location: 'header', label: 'Sign in' })">Sign in</a>
          <a href="{{ site.Params.demoURL }}" class="btn-secondary btn-md" onclick="posthog.capture('cta_click', { location: 'header', label: 'Book a demo' })">Book a demo</a>
          <a href="{{ site.Params.signupURL }}" class="btn-primary btn-md" onclick="posthog.capture('cta_click', { location: 'header', label: 'Start free' })">Start free</a>
        </div>
        {{ partial "nav-mobile.html" . }}
      </div>
    </div>
  </div>
</header>
