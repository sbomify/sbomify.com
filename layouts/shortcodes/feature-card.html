<div class="group bg-canvas p-8 rounded-3xl border border-line shadow-card hover:shadow-raised hover:border-line-strong motion-safe:hover:-translate-y-1 transition-[box-shadow,transform,border-color] duration-300">
    <div class="w-14 h-14 {{ .Get "icon_bg_class" }} rounded-2xl flex items-center justify-center {{ .Get "icon_text_class" }} mb-6 motion-safe:group-hover:scale-110 transition-transform duration-300">
        {{ if .Get "svg" }}{{ .Get "svg" | safeHTML }}{{ else }}{{ .Inner | safeHTML }}{{ end }}
    </div>
    <h3 class="text-2xl font-bold text-ink mb-4">{{ .Get "title" }}</h3>
    <p class="text-ink-muted leading-relaxed">
        {{ .Get "description" | safeHTML }}
    </p>
</div>
