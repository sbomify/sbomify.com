<div class="group border-t border-line pt-7 pb-2">
    <div class="icon-tile {{ .Get "icon_bg_class" }} {{ .Get "icon_text_class" }} mb-5">
        {{ if .Get "svg" }}{{ .Get "svg" | safeHTML }}{{ else }}{{ .Inner | safeHTML }}{{ end }}
    </div>
    <h3 class="text-xl font-bold tracking-heading text-ink mb-3">{{ .Get "title" }}</h3>
    <p class="text-ink-muted leading-relaxed">
        {{ .Get "description" | safeHTML }}
    </p>
</div>
