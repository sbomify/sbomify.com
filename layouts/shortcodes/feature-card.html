<div class="group bg-canvas p-8 rounded-3xl border border-line shadow-card">
    <div class="w-14 h-14 {{ .Get "icon_bg_class" }} rounded-2xl flex items-center justify-center {{ .Get "icon_text_class" }} mb-6">
        {{ if .Get "svg" }}{{ .Get "svg" | safeHTML }}{{ else }}{{ .Inner | safeHTML }}{{ end }}
    </div>
    <h3 class="text-2xl font-bold text-ink mb-4">{{ .Get "title" }}</h3>
    <p class="text-ink-muted leading-relaxed">
        {{ .Get "description" | safeHTML }}
    </p>
</div>
