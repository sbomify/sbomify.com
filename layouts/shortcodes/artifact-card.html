<div class="bg-canvas p-5 rounded-xl border border-line flex items-center gap-5">
    <div class="w-11 h-11 {{ .Get "icon_bg_class" }} rounded-lg flex items-center justify-center {{ .Get "icon_text_class" }} flex-shrink-0">
        {{ .Get "svg" | safeHTML }}
    </div>
    <div>
        <div class="font-bold text-ink text-lg mb-1">{{ .Get "title" }}</div>
        <div class="flex items-center gap-2">
            <span class="text-xs font-medium {{ .Get "badge_text_class" }} {{ .Get "badge_bg_class" }} px-2 py-0.5 rounded-md border {{ .Get "badge_border_class" }}">{{ .Get "badge_text" }}</span>
            <span class="text-xs text-ink-muted">{{ .Get "subtext" }}</span>
        </div>
    </div>
</div>
