<div class="group border-t border-line pt-7 pb-2 flex flex-col h-full">
    <div class="icon-tile {{ .Get "icon_bg_class" | default "bg-surface-strong" }} {{ .Get "icon_text_class" | default "text-ink" }} mb-5">
        {{ if .Get "svg" }}{{ .Get "svg" | safeHTML }}{{ else }}{{ .Inner | safeHTML }}{{ end }}
    </div>
    <h3 class="text-xl font-bold tracking-heading text-ink mb-3">{{ .Get "title" }}</h3>
    <p class="text-ink-muted leading-relaxed mb-6 flex-grow">
        {{ .Get "description" | safeHTML }}
    </p>
    <div class="eyebrow">{{ .Get "link_text" }}</div>
</div>
