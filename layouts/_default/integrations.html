{{ define "main" }}
<div>
  <div class="hero">
      <div class="hero-fade" aria-hidden="true"></div>
    <div class="wrap pt-10 lg:pt-16 pb-12 lg:pb-16">
      <h1 class="text-ink mb-6 max-w-[18ch]">
        {{ .Title }}
      </h1>
      {{ with .Params.description }}
      <p class="lede max-w-3xl">
        {{ . }}
      </p>
      {{ end }}
    </div>
  </div>

  <div class="wrap pb-10 lg:pb-16">
    {{ partial "content.html" . }}
  </div>
</div>
{{ end }}
