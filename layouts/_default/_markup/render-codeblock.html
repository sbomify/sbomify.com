{{- $result := transform.HighlightCodeBlock . -}}
{{- /* The header band carries the language and a copy button, as the app's
     code block does. The button ships hidden and assets/js/main.js reveals
     it, so there is no dead control without JavaScript. */ -}}
<figure class="code-block"><figcaption class="code-block-header"><span class="code-block-lang">{{ .Type }}</span><button type="button" class="code-block-copy" data-code-copy hidden>Copy</button></figcaption>{{ $result.Wrapped }}</figure>
