<style>
/* Colours and type come from the tokens in _assets/css/tokens.css. */
.pricing-page {
  max-width: 1280px;
  margin: 0 auto;
  padding: 4rem 2rem;
}
.pricing-header {
  text-align: center;
  margin-bottom: 3rem;
}
.pricing-header h1 {
  font-size: 3.5rem;
  font-weight: var(--font-weight-extrabold);
  letter-spacing: var(--tracking-display);
  color: rgb(var(--color-ink));
  margin-bottom: 1rem;
}
.pricing-header p {
  font-size: 1.125rem;
  color: rgb(var(--color-ink-muted));
}
.billing-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 3rem;
  font-size: 1rem;
  font-weight: var(--font-weight-medium);
  color: rgb(var(--color-ink));
}
.toggle {
  position: relative;
  width: 3.5rem;
  height: 2rem;
  display: inline-block;
}
.toggle input {
  opacity: 0;
  width: 0;
  height: 0;
}
.track {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgb(var(--color-navy-40));
  transition: .3s;
  border-radius: 2rem;
}
.track:before {
  position: absolute;
  content: "";
  height: 1.5rem;
  width: 1.5rem;
  left: 0.25rem;
  bottom: 0.25rem;
  background-color: rgb(var(--color-white));
  transition: .3s;
  border-radius: 50%;
}
input:checked + .track {
  background-color: rgb(var(--color-ink));
}
input:checked + .track:before {
  transform: translateX(1.5rem);
}
input:focus-visible + .track {
  outline: 2px solid rgb(var(--color-focus));
  outline-offset: 2px;
}
.save-tag {
  background-color: rgb(var(--color-success-tint));
  color: rgb(var(--color-ink));
  border: 1px solid rgb(var(--color-success-full) / 0.35);
  padding: 0.25rem 0.75rem;
  border-radius: 1rem;
  font-size: 0.875rem;
  font-weight: var(--font-weight-semibold);
  margin-left: 0.5rem;
}
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(360px, 1fr));
  gap: 2rem;
  margin: 0 auto;
}
.pricing-card {
  background: rgb(var(--color-canvas));
  border: 1px solid rgb(var(--color-line));
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 40px;
  display: flex;
  flex-direction: column;
}
/* The featured plan is the one white-on-navy card, with the page's single
   orange moment: its call to action. */
.pricing-card.featured {
  background: rgb(var(--color-inverse));
  border-color: rgb(var(--color-inverse));
  box-shadow: var(--shadow-raised);
  position: relative;
}
.pricing-card.featured::before {
  content: "Most Popular";
  position: absolute;
  top: -0.875rem;
  left: 50%;
  transform: translateX(-50%);
  background: rgb(var(--color-canvas));
  color: rgb(var(--color-ink));
  border: 1px solid rgb(var(--color-line-strong));
  font-size: 0.75rem;
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
  padding: 0.25rem 0.875rem;
  border-radius: var(--radius-pill);
  white-space: nowrap;
}
.card-header {
  min-height: 200px;
  display: flex;
  flex-direction: column;
  margin-bottom: 32px;
}
.trial-badge {
  display: inline-block;
  background: rgb(var(--color-success-tint));
  color: rgb(var(--color-ink));
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  border: 1px solid rgb(var(--color-success-full) / 0.35);
  vertical-align: middle;
  margin-left: 12px;
  font-weight: var(--font-weight-medium);
}
.pricing-card h2 {
  font-size: 32px;
  font-weight: var(--font-weight-bold);
  color: rgb(var(--color-ink));
  margin-bottom: 24px;
}
.pricing-card h3 {
  font-size: 0.75rem;
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
  color: rgb(var(--color-ink-muted));
  margin-bottom: 20px;
}
.price {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 24px;
}
.price .amount {
  font-size: 48px;
  font-weight: var(--font-weight-extrabold);
  letter-spacing: var(--tracking-display);
  color: rgb(var(--color-ink));
  line-height: 1;
}
.price .amount.custom {
  font-size: 48px;
}
.price .suffix {
  font-size: 24px;
  color: rgb(var(--color-ink-muted));
  font-weight: var(--font-weight-regular);
}
.price .billing {
  font-size: 16px;
  color: rgb(var(--color-ink-muted));
  font-weight: var(--font-weight-regular);
}
.pricing-card.featured h2,
.pricing-card.featured .price .amount {
  color: rgb(var(--color-on-inverse));
}
.pricing-card.featured h3,
.pricing-card.featured .price .suffix,
.pricing-card.featured .price .billing,
.pricing-card.featured .section li {
  color: rgb(var(--color-on-inverse-muted));
}
.pricing-card.featured .trial-badge {
  background: rgb(var(--color-white) / 0.1);
  color: rgb(var(--color-on-inverse));
  border-color: rgb(var(--color-white) / 0.2);
}
.card-body {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.section + .section {
  margin-top: 32px;
}
.card-footer {
  margin-top: 32px;
  text-align: center;
  padding: 0;
}
.cta-button {
  display: inline-block;
  width: 100%;
  background: rgb(var(--color-canvas));
  color: rgb(var(--color-ink));
  border: 1px solid rgb(var(--color-line-strong));
  font-size: 16px;
  font-weight: var(--font-weight-semibold);
  padding: 16px 32px;
  border-radius: var(--radius-pill);
  text-decoration: none;
  transition: background-color 0.2s, border-color 0.2s;
  cursor: pointer;
}
.cta-button:hover {
  border-color: rgb(var(--color-ink));
}
.pricing-card.featured .cta-button {
  background: rgb(var(--color-accent-strong));
  border-color: rgb(var(--color-accent-strong));
  color: rgb(var(--color-on-accent));
}
.pricing-card.featured .cta-button:hover {
  background: rgb(var(--color-accent-hover));
  border-color: rgb(var(--color-accent-hover));
}
.section {
  display: block;
  min-height: initial;
}
.section ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 16px;
}
.section li {
  position: relative;
  padding-left: 28px;
  color: rgb(var(--color-ink-muted));
  font-size: 14px;
  line-height: 1.5;
}
.section li:before {
  content: "\2713";
  position: absolute;
  left: 0;
  color: rgb(var(--color-success-full));
  font-weight: var(--font-weight-semibold);
}
.section li a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dashed currentColor;
}
.section li a:hover {
  color: rgb(var(--color-accent-strong));
}
.pricing-card.featured .section li a:hover {
  color: rgb(var(--color-accent));
}
@media (max-width: 1200px) {
  /* Single column: lead with the recommended plan */
  .pricing-card.featured {
    order: -1;
  }
  .pricing-grid {
    grid-template-columns: 1fr;
    max-width: 480px;
    margin: 0 auto;
  }
}
</style>

{{ partial "content.html" . }}

<script>
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.getElementById('billing-toggle');
  var priceElements = document.querySelectorAll('.price[data-monthly]');

  function updatePrices(isAnnual) {
    priceElements.forEach(function(el) {
      var monthly = el.getAttribute('data-monthly');
      var annual = el.getAttribute('data-annual');

      if (isAnnual) {
        el.innerHTML =
          '<span class="amount">$' + annual + '</span>' +
          '<span class="suffix">/ Month</span>' +
          '<span class="billing">billed annually</span>';
      } else {
        el.innerHTML =
          '<span class="amount">$' + monthly + '</span>' +
          '<span class="suffix">/ Month</span>';
      }
    });
  }

  toggle.addEventListener('change', function() {
    var billingType = this.checked ? 'Annual' : 'Monthly';
    posthog.capture('billing_toggle', { location: 'pricing', billing_type: billingType });
    updatePrices(this.checked);
  });
});
</script>
{{ end }}
