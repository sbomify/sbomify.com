{{- /* Pricing: the content brings its own .ins root (as layout "ins"). The
       billing switch is two radios and CSS (see "Pricing page" in
       tailwind.css); this script only reports the choice to analytics. */ -}}
{{ define "main" }}
{{ partial "content.html" . }}
<script>
document.querySelectorAll('input[name="billing"]').forEach(function (r) {
  r.addEventListener('change', function () {
    posthog.capture('billing_toggle', { location: 'pricing', billing_type: r.value });
  });
});
</script>
{{ end }}
